<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Менің Docker жобам</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            text-align: center;
            padding: 60px 20px;
        }
        .card {
            max-width: 500px;
            margin: auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        h1 { 
            color: #1769aa; 
        }
        p {
            color: #333;
            font-size: 16px;
        }
        .student-info {
            background: #f0f4f8;
            padding: 10px;
            border-radius: 8px;
            margin: 15px 0;
            font-weight: bold;
            color: #2c3e50;
        }
        button {
            padding: 12px 20px;
            background: #1769aa;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #124d7b;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Docker сәтті іске қосылды!</h1>
        <p>Бұл веб-сайт Docker контейнерінде жұмыс істеп тұр.</p>
        
        <!-- Студенттің аты-жөні мен тобы -->
        <div class="student-info">
            Студент: Бақытбек Нұртілек<br>
            Топ: Программное обеспечение
        </div>

        <button onclick="alert('Сайт дұрыс жұмыс істейді!')">
            Тексеру
        </button>
    </div>
</body>
</html>
